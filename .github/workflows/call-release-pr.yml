name: Release PR (callable)

on:
  workflow_call:
    inputs:
      new-version:
        description: New version to release
        required: false
        type: string
      new-version-command:
        description: Command to determine a new version (priority over `new-version` if specified)
        required: false
        type: string
      node-version:
        description: Node.js version
        required: false
        default: latest
        type: string
      node-version-file:
        description: Node.js version file (takes priority over `node-version` if specified)
        required: false
        default: ''
        type: string

jobs:
  release-pr:
    runs-on: ubuntu-slim

    permissions:
      contents: write
      pull-requests: write

    timeout-minutes: 10

    # Ensure only one release job runs at a time to avoid conflicts.
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: true

    defaults:
      run:
        shell: bash

    outputs:
      new-version: ${{ steps.create-pr.outputs.pkg-version }}
      pr-branch: ${{ steps.create-pr.outputs.pr-branch }}
      pr-url: ${{ steps.create-pr.outputs.pr-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Commit history may be required, such as changelog generation etc.

      - name: Set up Node.js ${{ inputs.node-version-file || inputs.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ case(!inputs.node-version-file, inputs.node-version, '') }}
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      - name: Install latest npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Bump version in package.json
        env:
          NEW_VERSION: ${{ inputs.new-version }}
          NEW_VERSION_COMMAND: ${{ inputs.new-version-command }}
          # Set the environment variables below for `new-version-command` that needs any GitHub token.
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Set a new version if a command is provided
          if [[ -n "${NEW_VERSION_COMMAND}" ]]; then
            echo "Setting a new version using the command: \`${NEW_VERSION_COMMAND}\`"
            eval "${NEW_VERSION_COMMAND}"
          elif [[ -n "${NEW_VERSION}" ]]; then
            echo "Use the provided new version: ${NEW_VERSION}"
            npm version "${NEW_VERSION}" --no-git-tag-version
          else
            echo "::error::Either \`new-version\` or \`new-version-command\` input is required."
            exit 1
          fi

      - name: Create pull request
        id: create-pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.sha }}
        run: |
          # Configure git
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"

          PKG_VERSION=$(jq -r '.version' package.json)
          echo "pkg-version=${PKG_VERSION}" >> "${GITHUB_OUTPUT}"

          BRANCH_NAME="release/${PKG_VERSION}"
          COMMIT_MESSAGE="Release ${PKG_VERSION}"

          # Build the package table from changed package.json files
          TABLE_ROWS=''

          mapfile -t CHANGED_PACKAGE_JSON_FILES < <(
            git diff --name-only --diff-filter=ACMR "${BASE_SHA}" -- ':(glob)**/package.json'
          )

          for PACKAGE_JSON in "${CHANGED_PACKAGE_JSON_FILES[@]}"; do
            PACKAGE_NAME=$(jq -r '.name // empty' "${PACKAGE_JSON}")
            PACKAGE_VERSION=$(jq -r '.version // empty' "${PACKAGE_JSON}")

            if [[ -z "${PACKAGE_NAME}" || -z "${PACKAGE_VERSION}" ]]; then
              echo "::error::${PACKAGE_JSON} must have both \`name\` and \`version\`."
              exit 1
            fi

            PREVIOUS_JSON=$(git show "${BASE_SHA}:${PACKAGE_JSON}" 2>/dev/null || true)
            PREVIOUS_VERSION=$(jq -r '.version // empty' <<< "${PREVIOUS_JSON}")

            # Skip packages whose version has not changed
            if [[ "${PACKAGE_VERSION}" == "${PREVIOUS_VERSION}" ]]; then
              continue
            fi

            # Construct the published URL
            PRIVATE=$(jq -r '.private // false' "${PACKAGE_JSON}")
            VSCODE_VERSION=$(jq -r '.engines.vscode // empty' "${PACKAGE_JSON}")
            VSCODE_PUBLISHER=$(jq -r '.publisher // empty' "${PACKAGE_JSON}")

            if [[ -n "${VSCODE_VERSION}" ]]; then
              if [[ -z "${VSCODE_PUBLISHER}" ]]; then
                echo "::error::${PACKAGE_JSON} has \`engines.vscode\` but no \`publisher\`."
                exit 1
              fi
              PACKAGE_URL="<https://marketplace.visualstudio.com/items?itemName=${VSCODE_PUBLISHER}.${PACKAGE_NAME}>"
            elif [[ "${PRIVATE}" == "true" ]]; then
              PACKAGE_URL='N/A'
            else
              PACKAGE_URL="<https://www.npmjs.com/package/${PACKAGE_NAME}>"
            fi

            # Scoped packages use `<name>@<version>` tags; others use `<version>`.
            # A root package may be scoped but still tagged with `<version>`.
            PREVIOUS_TAG="${PREVIOUS_VERSION}"

            if [[ "${PACKAGE_NAME}" == @* ]] && git rev-parse --verify --quiet "refs/tags/${PACKAGE_NAME}@${PREVIOUS_VERSION}" > /dev/null; then
              PREVIOUS_TAG="${PACKAGE_NAME}@${PREVIOUS_VERSION}"
            fi

            if [[ -z "${PREVIOUS_VERSION}" ]] || ! git rev-parse --verify --quiet "refs/tags/${PREVIOUS_TAG}" > /dev/null; then
              PREVIOUS_TAG='@{1year}'
            fi

            PREVIOUS_VERSION_LABEL='N/A'
            if [[ -n "${PREVIOUS_VERSION}" ]]; then
              PREVIOUS_VERSION_LABEL="\`${PREVIOUS_VERSION}\`"
            fi
            CHANGES_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${BRANCH_NAME}"
            ROW="| \`${PACKAGE_NAME}\` | ${PREVIOUS_VERSION_LABEL} → \`${PACKAGE_VERSION}\` | <${CHANGES_URL}> | ${PACKAGE_URL} |"

            if [[ -z "${TABLE_ROWS}" ]]; then
              TABLE_ROWS="${ROW}"
            else
              TABLE_ROWS+=$'\n'"${ROW}"
            fi
          done

          if [[ -z "${TABLE_ROWS}" ]]; then
            echo "::error::No package version changes found."
            exit 1
          fi

          # Commit and push changes to a new branch
          git checkout -b "${BRANCH_NAME}"
          git commit --all -am "${COMMIT_MESSAGE}"
          git push origin "${BRANCH_NAME}"
          echo "pr-branch=${BRANCH_NAME}" >> "${GITHUB_OUTPUT}"

          # Prepare PR body
          PR_BODY_FILE="${RUNNER_TEMP}/pr_body.txt"
          cat <<EOF > "${PR_BODY_FILE}"
          This PR prepares the release of the following packages:

          | Package | Version | Changes | Published |
          | --- | --- | --- | --- |
          ${TABLE_ROWS}

          Checklist:
          - [ ] Quickly review the changes above.
          - [ ] The new version is expected.
          - [ ] The CHANGELOG.md is expected. If necessary, update it (to add a summary or reorder the entries).
          - [ ] Request a review from the owners team.

          If the PR is approved and all checks have passed, you can merge it. Then, the release job will be automatically started.
          Visit [**Actions**](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions) and watch the job.

          *Generated by the [action run (id=${GITHUB_RUN_ID})](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})*
          EOF

          # Create PR
          echo "Creating a pull request..."
          gh pr create \
            --head "${BRANCH_NAME}" \
            --title "${COMMIT_MESSAGE}" \
            --body-file "${PR_BODY_FILE}" \
            --label 'pr: release' \
            --assignee "${GITHUB_ACTOR}"

          # Show PR URL
          PR_URL=$(gh pr view --json 'url' --jq '.url')
          echo "::notice::Created pull request for releasing ${PKG_VERSION}: ${PR_URL}"
          echo "pr-url=${PR_URL}" >> "${GITHUB_OUTPUT}"
