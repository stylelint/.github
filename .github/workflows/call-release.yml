name: Release (callable)

on:
  workflow_call:
    inputs:
      publish:
        description: If true, run the publishing step
        required: false
        default: true
        type: boolean
      publish-npm:
        description: If true, publish to npm registry via `npm publish`. If false, run `npm run publish` instead.
        required: false
        default: true
        type: boolean
      publish-npm-staged:
        # TODO: Migrate all the packages to staged publishing, rename this input to `publish-npm`,
        # and finally enforce the new publishing.
        # Ref: https://docs.npmjs.com/staged-publishing
        description: If true, use `npm stage publish` instead of `npm publish`.
        required: false
        default: false
        type: boolean
      workspace:
        description: Name of the npm workspace package.
        required: false
        default: ''
        type: string
      node-version:
        description: Node.js version
        required: false
        default: latest
        type: string
      node-version-file:
        description: Node.js version file (takes priority over `node-version` if specified)
        required: false
        default: ''
        type: string
    secrets:
      # NOTE: If publishing via OIDC is available, this secret may not be required.
      # Ref https://github.com/microsoft/vscode-vsce/issues/1133
      VSCE_PAT:
        description: Personal Access Token for publishing to Visual Studio Marketplace
        required: false

jobs:
  release:
    # Only when a PR with a branch name starting with `release/` is merged.
    # For the branch name convention, see `call-release-pr.yml`.
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')

    runs-on: ubuntu-slim

    permissions:
      contents: write
      id-token: write # Required for OIDC. See https://docs.npmjs.com/trusted-publishers

    timeout-minutes: 10

    # Require manual approval before publishing.
    # See https://docs.github.com/en/actions/how-tos/deploy/configure-and-manage-deployments/control-deployments
    environment: npm
    concurrency: npm

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js ${{ inputs.node-version-file || inputs.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ case(!inputs.node-version-file, inputs.node-version, '') }}
          node-version-file: ${{ inputs.node-version-file }}
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install latest npm
        run: npm install --global npm@latest

      - name: Get package info
        id: pkg
        env:
          NPM_CONFIG_WORKSPACE: ${{ inputs.workspace }}
        run: |
          metadata=$(npm pkg get 'name' 'version' 'repository.directory' --json)
          manifest=$(jq -c --arg 'ws' "${NPM_CONFIG_WORKSPACE}" '.[$ws] // .' <<<"${metadata}")
          package_name=$(jq -r '.name' <<<"${manifest}")
          package_version=$(jq -r '.version' <<<"${manifest}")
          package_dir=$(jq -r '.["repository.directory"] // empty' <<<"${manifest}")

          if [[ -z "${NPM_CONFIG_WORKSPACE}" ]]; then
            changelog="CHANGELOG.md"
            tag="${package_version}"
            release=""
          else
            if [[ -z "${package_dir}" ]]; then
              echo "::error::The package '${package_name}' must have the 'repository.directory' field in its package.json."
              exit 1
            fi
            changelog="${package_dir}/CHANGELOG.md"
            tag="${package_name}@${package_version}"
            release="${package_name} ${package_version}"
          fi

          {
            echo "name=${package_name}"
            echo "version=${package_version}"
            echo "tag=${tag}"
            echo "changelog=${changelog}"
            echo "release=${release}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: npm ci

      # Always use `ignore-scripts=true`, so lifecycle scripts never run automatically.
      - name: Pre-publish
        if: ${{ inputs.publish && inputs.publish-npm }}
        env:
          NPM_CONFIG_WORKSPACE: ${{ inputs.workspace }}
        run: npm run prepack --if-present

      - name: Publish to npm registry
        if: ${{ inputs.publish && inputs.publish-npm }}
        env:
          NPM_CONFIG_WORKSPACE: ${{ inputs.workspace }}
          STAGED_PUBLISHING: ${{ inputs.publish-npm-staged }}
          PACKAGE_NAME: ${{ steps.pkg.outputs.name }}
          PACKAGE_VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          if [[ "${STAGED_PUBLISHING}" == "true" ]]; then
            npm stage publish
          else
            npm publish
          fi
          echo "::notice::Published https://www.npmjs.com/package/${PACKAGE_NAME}/v/${PACKAGE_VERSION}"

      - name: Run non-npm publishing
        if: ${{ inputs.publish && !inputs.publish-npm }}
        env:
          NPM_CONFIG_WORKSPACE: ${{ inputs.workspace }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npm run publish

      - name: Create GitHub release
        uses: stylelint/changelog-to-github-release-action@fa1228a5ad2a0089273852a32261ca1b3efda395 # 0.6.0
        with:
          tag: ${{ steps.pkg.outputs.tag }}
          name: ${{ steps.pkg.outputs.release }}
          changelog: ${{ steps.pkg.outputs.changelog }}
          draft: true
