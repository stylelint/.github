name: Test (callable)

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js versions as a JSON array (takes priority over `node-version-file` if specified)
        required: false
        default: ''
        type: string
      node-version-file:
        description: Node.js version file
        required: false
        default: package.json
        type: string
      os:
        description: OS name
        required: false
        default: '["ubuntu-latest"]'
        type: string
      exclude:
        description: Exclude from matrix
        required: false
        default: '[]'
        type: string
      test-options:
        description: Options to pass the test command
        required: false
        default: ''
        type: string

jobs:
  test:
    name: Test on Node.js ${{ case(inputs.node-version != '', matrix.node-version, inputs.node-version-file) }} and ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # NOTE: The `strategy` property is not fully supported, so it uses `fromJson()`.
        #       For details, see https://github.community/t/reusable-workflow-with-strategy-matrix/205676/2
        # NOTE: Use a placeholder to avoid an empty matrix if `node-version` is not specified.
        node-version: ${{ fromJson(inputs.node-version || '["(skipped)"]') }}
        os: ${{ fromJson(inputs.os) }}
        exclude: ${{ fromJson(inputs.exclude) }}

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js ${{ case(inputs.node-version != '', matrix.node-version, inputs.node-version-file) }}
        id: setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Pass only one of them because `setup-node` warns if both are specified
          node-version: ${{ case(inputs.node-version != '', matrix.node-version, '') }}
          node-version-file: ${{ case(inputs.node-version == '', inputs.node-version-file, '') }}

      - name: Detect npm version
        id: npm-version
        env:
          node_version: ${{ steps.setup-node.outputs.node-version }}
        run: |
          case "${node_version}" in
            # npm v12 drops support for Node.js v20
            v20*) npm_version='11' ;;
               *) npm_version='latest' ;;
          esac
          echo "Detected npm version: ${npm_version}"
          echo "version=${npm_version}" >> "${GITHUB_OUTPUT}"

      - name: Install npm ${{ steps.npm-version.outputs.version }}
        env:
          npm_version: ${{ steps.npm-version.outputs.version }}
        run: |
          # Show the current versions to help debugging
          echo "Current Node.js version: $(node --version)"
          current_npm_version=$(npm --version)
          echo "Current npm version: ${current_npm_version}"

          npm install --global "npm@${npm_version}"
          echo "Successfully installed npm $(npm --version)"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test --ignore-scripts -- ${{ inputs.test-options }}
